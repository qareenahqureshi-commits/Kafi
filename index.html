<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Kafi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F4EF; --surface:#FFFFFF; --surface2:#ECEFE8; --tint:#F7F3EA; --ink:#13201A; --muted:#5D6B63; --line:#DCE2DA;
  --accent:#1D6B57; --accent-ink:#FFFFFF; --saffron:#B8761A;
  --fresh:#2B8F60; --soon:#C48D14; --exp:#C9452E; --leftover:#7356C2; --plan:#1A86A0;
  --shadow:0 1px 2px rgba(19,32,26,.05),0 10px 30px -12px rgba(19,32,26,.14);
  --stage:#0A1310; --glass:rgba(10,20,17,.72); --glass-line:rgba(170,210,195,.14); --glass-ink:#E8F0EC; --glass-muted:#93A89E; --mint:#4DB292;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1310; --surface:#111C18; --surface2:#182420; --tint:#16211C; --ink:#E6EEE9; --muted:#93A39A; --line:#22312B;
  --accent:#4DB292; --accent-ink:#06120E; --saffron:#E2A548;
  --fresh:#4BBF88; --soon:#E6B449; --exp:#EE6A51; --leftover:#A68AEA; --plan:#4FC0DA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1310; --surface:#111C18; --surface2:#182420; --tint:#16211C; --ink:#E6EEE9; --muted:#93A39A; --line:#22312B;
  --accent:#4DB292; --accent-ink:#06120E; --saffron:#E2A548;
  --fresh:#4BBF88; --soon:#E6B449; --exp:#EE6A51; --leftover:#A68AEA; --plan:#4FC0DA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -14px rgba(0,0,0,.6); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(1.55rem,1.1rem + 1.7vw,2.25rem);font-weight:600;letter-spacing:-.015em}
h2{font-size:1.1rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--f-display);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
[dir="rtl"] .eyebrow{letter-spacing:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:252px minmax(0,1fr);height:100%}
.nav{background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-block:18px 12px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px}
[dir="rtl"] .nav{padding-right:max(14px,env(safe-area-inset-right,0px));padding-left:14px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 18px}
.brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#2A8A6F,#164F41);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.1rem;box-shadow:0 6px 16px -6px rgba(29,107,87,.7)}
.brand b{font-family:var(--f-display);font-size:1.15rem;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.74rem}
.nav-scroll{overflow:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group .eyebrow{padding:4px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:.92rem}
.nav a svg{width:18px;height:18px;flex:none;stroke:var(--muted);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:600}
.nav a.on svg{stroke:var(--accent)}
.nav a .count{margin-inline-start:auto;background:var(--exp);color:#fff;font-size:.68rem;border-radius:99px;padding:0 7px;font-family:var(--f-mono)}
.nav-foot{border-top:1px solid var(--line);padding:12px 8px 0;font-size:.72rem;color:var(--muted);line-height:1.45}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:18px;padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
[dir="rtl"] .top{padding-right:18px;padding-left:max(16px,env(safe-area-inset-left,0px))}
.menu-btn{display:none}
.hh{min-width:0;flex:1;display:flex;align-items:center;gap:10px}
.hh .av{display:flex}
.hh .av span{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);margin-inline-start:-8px;display:grid;place-items:center;font-size:.62rem;font-weight:600;color:#fff;font-family:var(--f-display)}
.hh .av span:first-child{margin-inline-start:0}
.hh .tx{min-width:0}
.hh b{font-family:var(--f-display);font-weight:600;font-size:.93rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hh small{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.beat{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 8px;background:var(--bg)}
.beat canvas{width:92px;height:26px;display:block}
.beat small{font-size:.7rem;color:var(--muted);white-space:nowrap}
.ib{height:36px;min-width:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;position:relative;font-size:.85rem}
.ib:hover{background:var(--surface2)}
.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib .dot{position:absolute;top:-5px;inset-inline-end:-5px;background:var(--exp);color:#fff;font-size:.64rem;min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;font-family:var(--f-mono);border:2px solid var(--surface)}
.play{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.play:hover{background:var(--accent);filter:brightness(1.08)}

#view{flex:1;overflow:auto;min-height:0;position:relative}
.page{max-width:1140px;margin:0 auto;padding-block:30px 120px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;flex-direction:column;gap:8px;max-width:70ch}
.page-head p.lede{color:var(--muted);font-size:1rem}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
.split-r{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.stat .eyebrow{display:block;margin-bottom:8px}
.stat .v{font-family:var(--f-display);font-size:2rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .s{color:var(--muted);font-size:.84rem;margin-top:6px}
.stat.warn .v{color:var(--soon)} .stat.bad .v{color:var(--exp)} .stat.good .v{color:var(--fresh)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head p{color:var(--muted);font-size:.86rem}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:.74rem;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-fresh{color:var(--fresh);background:color-mix(in srgb,var(--fresh) 12%,transparent)}
.p-soon{color:var(--soon);background:color-mix(in srgb,var(--soon) 14%,transparent)}
.p-exp{color:var(--exp);background:color-mix(in srgb,var(--exp) 12%,transparent)}
.p-leftover{color:var(--leftover);background:color-mix(in srgb,var(--leftover) 13%,transparent)}
.p-plan{color:var(--plan);background:color-mix(in srgb,var(--plan) 13%,transparent)}
.p-muted{color:var(--muted);background:var(--surface2)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 15px;font-weight:500;font-size:.9rem;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600;box-shadow:0 6px 18px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.btn.pri:hover{filter:brightness(1.07);background:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:500}
.li .d{color:var(--muted);font-size:.82rem}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-family:var(--f-display);font-weight:500;text-align:start;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
code,.tool{font-family:var(--f-mono);font-size:.8rem;background:var(--surface2);padding:1px 6px;border-radius:6px;white-space:nowrap}
.mut{color:var(--exp);font-size:.72rem;font-weight:600;white-space:nowrap}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.foot{color:var(--muted);font-size:.78rem;border-top:1px solid var(--line);padding-top:14px}

/* food imagery */
.th{flex:none;border-radius:14px;background:radial-gradient(circle at 50% 38%,var(--surface) 0,var(--tint) 70%);display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:contain;display:block}
.th.s40{width:40px;height:40px;border-radius:10px}
.th.s48{width:48px;height:48px;border-radius:12px}
.th.s56{width:56px;height:56px}
.th.s64{width:64px;height:64px}
.th.s96{width:96px;height:96px;border-radius:18px}
.th i{width:40%;height:40%;border-radius:50%}
.mini{width:22px;height:22px;border-radius:6px;vertical-align:middle;margin-inline-end:2px}

/* Today hero */
.hero-plate .th{width:84px;height:84px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center;padding:26px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 9%,var(--surface)) 0,var(--surface) 60%);overflow:hidden;position:relative}
.hero h1{margin-top:6px}
.hero p.sum{color:var(--muted);margin-top:10px;font-size:1rem;max-width:52ch}
.hero .row{margin-top:18px}
.hero-plate{display:flex;justify-content:center;gap:10px;align-items:flex-end;position:relative}
.hero-plate .th{box-shadow:0 14px 30px -16px rgba(0,0,0,.35)}
.hero-plate .th:nth-child(2){width:116px;height:116px;border-radius:22px}
.usefirst{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);position:relative}
.fcard .th{width:100%;height:110px;border-radius:12px;border:0}
.fcard b{font-size:.9rem;font-weight:600;line-height:1.25}
.fcard .d{font-size:.76rem;color:var(--muted)}
.fcard .pill{position:absolute;top:18px;inset-inline-start:18px}

/* Kitchen 2D */
.kit{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.appl{border-radius:22px;padding:14px;background:linear-gradient(180deg,#eef3f2,#dfe7e5);border:1px solid #cdd8d5;box-shadow:inset 0 1px 0 #fff,var(--shadow)}
:root[data-theme="dark"] .appl{background:linear-gradient(180deg,#1b2724,#141e1b);border-color:#2a3a35;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),var(--shadow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .appl{background:linear-gradient(180deg,#1b2724,#141e1b);border-color:#2a3a35;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),var(--shadow)}}
.appl.wood{background:linear-gradient(180deg,#efe4d3,#e4d4bd);border-color:#d6c3a6}
:root[data-theme="dark"] .appl.wood{background:linear-gradient(180deg,#2a2219,#221b14);border-color:#3a2f22}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .appl.wood{background:linear-gradient(180deg,#2a2219,#221b14);border-color:#3a2f22}}
.appl-h{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 10px}
.appl-in{background:var(--surface);border-radius:14px;padding:4px 12px;border:1px solid var(--line)}
.shelf{border-bottom:2px solid color-mix(in srgb,var(--plan) 22%,var(--line));padding:12px 0 12px;display:flex;flex-wrap:wrap;gap:10px;position:relative}
.shelf:last-child{border-bottom:0}
.food{border:1px solid var(--line);border-radius:14px;padding:8px;width:118px;background:var(--bg);display:flex;flex-direction:column;gap:6px;text-align:start;position:relative;transition:transform .2s,box-shadow .2s}
.food:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.food .th{width:100%;height:76px;border:0;border-radius:10px}
.food b{font-size:.8rem;font-weight:600;line-height:1.2}
.food span{font-size:.7rem;color:var(--muted)}
.food .bar{height:4px}
.food.exp{border-color:color-mix(in srgb,var(--exp) 55%,var(--line))}
.food.soon{border-color:color-mix(in srgb,var(--soon) 55%,var(--line))}
.food.leftover{border-color:color-mix(in srgb,var(--leftover) 55%,var(--line))}
.food .tag{position:absolute;top:12px;inset-inline-end:12px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 3px var(--bg)}
.food.scan{animation:scan 1.1s ease}
@keyframes scan{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--plan) 60%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);border-radius:99px;padding:6px 13px;background:var(--surface);font-size:.82rem;display:inline-flex;gap:7px;align-items:center}
.fchip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.fchip[aria-pressed="false"]{opacity:.45}

/* Cook */
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.stepper .num{min-width:22px;text-align:center;font-weight:500}
.members{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.member{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.member span{font-size:.8rem;color:var(--muted)}
.dish{display:grid;grid-template-columns:56px minmax(0,1.4fr) minmax(0,.8fr) minmax(0,.8fr) minmax(0,1.1fr);gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.dish:last-child{border-bottom:0}
.dish .kafi{font-family:var(--f-display);font-weight:600;font-size:1.15rem;color:var(--accent)}
.dish .usual{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--exp) 60%,transparent)}
.cmp{display:flex;flex-direction:column;gap:4px}
.cmp .bar{height:8px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:.88rem}
.switch input{width:38px;height:22px;appearance:none;background:var(--surface2);border:1px solid var(--line);border-radius:99px;position:relative;cursor:pointer;margin:0}
.switch input::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:.2s}
.switch input:checked{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.switch input:checked::after{inset-inline-start:18px;background:var(--accent)}
input[type=range]{accent-color:var(--accent);width:100%}
.ing{display:flex;flex-wrap:wrap;gap:8px}
.ing .pill{padding:3px 10px 3px 4px}
.ing .pill::before{display:none}
.ing .pill img{width:22px;height:22px;border-radius:50%;background:var(--surface)}

/* Basket */
.bk{display:grid;grid-template-columns:48px minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:center}
.bk:last-child{border-bottom:0}
.bk .why{font-size:.8rem;color:var(--muted);grid-column:2/-1;margin-top:-6px}
.bk.head{padding-top:0}
.strike{text-decoration:line-through;color:var(--muted)}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0}
.tot b{font-family:var(--f-display);font-size:1.45rem}
.tot .num{white-space:nowrap}
.price-note{font-size:.76rem;color:var(--muted)}

/* modal, drawer, toast, caption */
.scrim{position:fixed;inset:0;background:rgba(6,12,10,.5);z-index:40;display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;max-width:480px;width:100%;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.opt{border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:start;background:var(--bg);display:flex;gap:12px;align-items:center;width:100%}
.opt .grow{flex:1;min-width:0}
.opt:hover{border-color:var(--accent)}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);background:var(--surface);border-inline-start:1px solid var(--line);z-index:30;transform:translateX(105%);transition:transform .35s ease;display:flex;flex-direction:column;padding-block:calc(env(safe-area-inset-top,0px) + 14px) 14px;padding-inline:16px;box-shadow:-10px 0 40px rgba(0,0,0,.18)}
[dir="rtl"] .drawer{transform:translateX(-105%)}
.drawer.open{transform:none!important}
.drawer .trace{overflow:auto;flex:1;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.tc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.82rem;display:flex;flex-direction:column;gap:4px;animation:slide .35s ease}
@keyframes slide{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.tc .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:.88rem;max-width:calc(100% - 32px)}
.caption{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:35;width:min(760px,calc(100% - 32px));background:var(--glass);color:var(--glass-ink);border:1px solid var(--glass-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.35)}

  r.setPixelRatio(1);r.setSize(220,220);r.outputEncoding=THREE.sRGBEncoding;
  const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight('#ffffff','#8a7a64',.5));
  const d=new THREE.DirectionalLight('#fff1dc',.85);d.position.set(2.5,4,3);sc.add(d);

  ids.forEach(id=>{
    const g=food(id);sc.add(g);

}

/* ---------- heartbeat ---------- */
class Heart{
  constructor(c,col,n){this.c=c;this.x=c.getContext('2d');this.n=n||140;this.d=new Array(this.n).fill(0);this.q=[];this.col=col;}
  beat(a){a=a||1;const w=[0,.06,.12,.05,0,-.12,1,-.38,0,.02,.1,.2,.24,.16,.05,0];this.q.push(...w.map(v=>v*a));}
  step(){const v=this.q.length?this.q.shift():(Math.random()-.5)*.025;this.d.push(v);this.d.shift();}
  draw(){
    const c=this.c,x=this.x,w=c.clientWidth,h=c.clientHeight;if(!w||!h) return;
    const dpr=Math.min(2,window.devicePixelRatio||1);
    if(c.width!==Math.round(w*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);}
    x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
    const col=typeof this.col==='function'?this.col():this.col;
    const gr=x.createLinearGradient(0,0,w,0);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.35,col);gr.addColorStop(1,col);
    x.lineWidth=1.6;x.strokeStyle=gr;x.lineJoin='round';x.beginPath();
    let px=0,py=0;
    this.d.forEach((v,i)=>{px=i/(this.n-1)*w;py=h*.62-v*h*.52;i?x.lineTo(px,py):x.moveTo(px,py);});
    x.stroke();x.fillStyle=col;x.beginPath();x.arc(px-1,py,2.4,0,7);x.fill();
  }
}
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let accentCol=cssv('--accent');
const hearts=[];
hearts.push(new Heart($('#beatTop'),()=>accentCol,90));
const agentHearts={};
let bigHeart=null;
function now(){return new Date().toTimeString().slice(0,5);}
function beat(agent,msg,amp){
  hearts.forEach(h=>h.beat(amp));
  if(agentHearts[agent]) agentHearts[agent].beat(1.2);
  S.events.unshift({time:now(),agent,msg});
  if(S.events.length>40) S.events.pop();
  if(S.view==='home') renderEvents();
  if(S.panel==='agents') renderPanel();
}
function call(agent,tool,mut,why,status){
  const e={time:now(),agent,tool,mut:!!mut,why,status:status||(mut?'done':'read')};
  S.audit.unshift(e);if(S.audit.length>80) S.audit.pop();
  beat(agent,why,mut?1.25:.8);
  renderTrace();if(S.view==='audit') renderAudit();
  return e;
}

  resetDemo();
  Object.assign(SC,{on:true,paused:false,skip:false,abort:false,i:0});
  try{for(SC.i=0;SC.i<STEPS.length;SC.i++){renderCap();await STEPS[SC.i].run();}}catch(e){}
  SC.on=false;renderCap();
}
function resetDemo(){
  closeModal();modalResolve=null;
  Object.assign(S,{foodOrder:'draft',box:'draft',surplus:{laban:true,khubz:true,dates:false},stage:'now',xray:false,sep:false,added:false,spinach:null,order:'draft',checkin:null,learn:[34,29,27,22,18,15,12,9],weekly:[7.8,7.1,6.6,5.9,5.2,4.8,4.4,4.1],saved:{kg:6.4,aed:148},orders:13,finished:{}});
  renderNav();
}
function doCheckin(k){
  if(S.checkin) return;
  S.checkin=k;S.learn=S.learn.concat([{none:6,some:8,lots:19}[k]]);
  S.weekly=S.weekly.concat([k==='lots'?4.6:k==='some'?3.9:3.6]).slice(-8);
  beat('leftover',{en:'Check-in: '+(k==='none'?'nothing':k==='some'?'a little':'a lot')+' left. Rice portion adjusted.',ar:'متابعة: تبقّى '+(k==='none'?'لا شيء':k==='some'?'قليل':'كثير')+'. تم تعديل مقدار الأرز.'});
  renderLeftovers();renderNav();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){e.preventDefault();go(g.dataset.go);return;}
  const a=e.target.closest('[data-act]');if(!a) return;
  switch(a.dataset.act){
    case 'nav':$('#nav').classList.toggle('open');break;
    case 'drawer':openDrawer();break;
    case 'lang':S.lang=S.lang==='en'?'ar':'en';try{localStorage.setItem('kafi.lang',S.lang);}catch(err){}i18nStatic();renderNav();render(S.view);renderTrace();renderCap();break;
    case 'theme':{const r=document.documentElement;const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';accentCol=cssv('--accent');break;}
    case 'play':play();break;
    case 'scpause':SC.paused=!SC.paused;renderCap();break;
    case 'scnext':SC.skip=true;break;
    case 'scexit':SC.abort=true;SC.on=false;renderCap();break;
    case 'skipboot':$('#boot')._skip=true;break;
    case 'layers':{const el=$('#twLayers');const mob=matchMedia('(max-width:820px)').matches;el.classList.toggle(mob?'show':'off');a.setAttribute('aria-pressed',mob?el.classList.contains('show'):!el.classList.contains('off'));break;}
    case 'xray':S.xray=!S.xray;renderTwinUI();break;
    case 'sep':S.sep=!S.sep;renderTwinUI();break;
    case 'stop':Twin.stop(a.dataset.s);break;
    case 'stage':S.stage=a.dataset.s;if(S.stage==='now') S.xray=false;Twin.applyStage();renderTwinUI();Twin.stop({now:'kitchen',predicted:'fridge',acts:'kitchen',saved:'bin'}[S.stage]);break;
    case 'panel':S.panel=S.panel===a.dataset.p?null:a.dataset.p;renderTwinUI();break;
    case 'layer':S.layers[a.dataset.l]=!S.layers[a.dataset.l];renderKitchen();break;
    case 'finish':{const id=a.dataset.id;S.finished[id]=!S.finished[id];renderKitchen();toast(S.finished[id]?t('k.finished'):t('k.correct'));if(S.finished[id]) beat('pantry',{en:'Kitchen memory corrected: '+nameOf(id)+' finished',ar:'تصحيح ذاكرة المطبخ: '+ITEMS.find(i=>i.id===id).ar+' منتهٍ'});break;}
    case 'photo':S.photoMode='fridge';$('#photo').click();break;
    case 'receipt':S.photoMode='receipt';$('#photo').click();break;
    case 'foodapprove':runFoodOrder();break;
    case 'boxsend':runBox();break;
    case 'pay':resolveModal(a.dataset.k);break;
    case 'm':{const k=a.dataset.k;S.m[k]=Math.max(k==='a'?1:0,Math.min(12,S.m[k]+(+a.dataset.d)));renderCook();break;}
    case 'addmissing':S.added=true;renderCook();beat('portion',{en:'Added loomi and bezar to the basket',ar:'إضافة اللومي والبزار إلى السلة'});toast(t('c.added'));break;
    case 'approve':runApproval();break;
    case 'spin':S.spinach=a.dataset.k;resolveModal();break;
    case 'cfyes':resolveModal(true);break;
    case 'cfno':resolveModal(false);break;
    case 'checkin':doCheckin(a.dataset.k);break;
    case 'afilter':S.auditFilter=a.dataset.f;renderAudit();break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.act==='tlayer'){S.layers[el.dataset.l]=el.checked;return;}
  if(el.dataset&&el.dataset.sur){S.surplus[el.dataset.sur]=el.checked;return;}
  if(el.id==='autopilot'){S.autopilot=el.checked;
    beat('basket',{en:S.autopilot?'Autopilot on: staples only, up to '+aed(S.limit)+' a week':'Autopilot off: every order waits for you',ar:S.autopilot?'الطيار الآلي مفعّل: الأساسيات فقط، حتى '+aed(S.limit)+' أسبوعياً':'الطيار الآلي متوقف: كل طلب ينتظرك'});
    if(S.autopilot&&!S.autoDone){S.autoDone=true;setTimeout(()=>{if(!S.autopilot) return;call('basket','cart_checkout',true,{en:'Autopilot: 30 eggs reordered for Dh 14.50, within your '+aed(S.limit)+' weekly limit',ar:'الطيار الآلي: إعادة طلب 30 بيضة بـ14.50 درهم، ضمن حدك الأسبوعي '+aed(S.limit)});toast(S.lang==='ar'?'الطيار الآلي أعاد طلب البيض ضمن حدك':'Autopilot reordered eggs within your limit');},5000);}
    return;}
  if(el.id==='photo'&&el.files&&el.files[0]&&S.photoMode==='receipt'){
    const n=$('#scanNote');if(n) n.textContent=t('k.scanning');
    setTimeout(()=>{if(n) n.textContent=t('k.receipted');beat('pantry',{en:'Receipt from another store read (simulated): 2 items added',ar:'قراءة إيصال من متجر آخر (محاكاة): أُضيف عنصران'});},1400);
    el.value='';S.photoMode='fridge';return;
  }
  if(el.id==='ramadan'){S.ramadan=el.checked;renderCook();if(S.ramadan) call('portion','food_get_scheduling_slots',false,{en:'Ramadan mode: looking for a delivery slot before the 3–5 pm rush',ar:'وضع رمضان: البحث عن موعد توصيل قبل ذروة 3–5 مساءً'});}
  if(el.id==='photo'&&el.files&&el.files[0]){
    const n=$('#scanNote');if(n) n.textContent=t('k.scanning');
    $$('.food').forEach((c,i)=>setTimeout(()=>c.classList.add('scan'),i*60));
    setTimeout(()=>{if(n) n.textContent=t('k.scanned');beat('pantry',{en:'Fridge photo matched to kitchen memory (simulated)',ar:'مطابقة صورة الثلاجة مع ذاكرة المطبخ (محاكاة)'});},1600);
    el.value='';
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.cb){S.cb[el.dataset.cb]=+el.value;cbOut();return;}
  if(el.id==='limit'){S.limit=+el.value;const v=$('#limitVal');if(v) v.textContent=aed(S.limit);return;}
  if(e.target.id==='appetite'){S.appetite=+e.target.value;const sc=$('#view').scrollTop;renderCook();$('#view').scrollTop=sc;const r=$('#appetite');if(r) r.focus();}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!modalResolve) closeModal();openDrawer(false);$('#nav').classList.remove('open');}
  if(S.view!=='twin'||/input|textarea|select/i.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key.toLowerCase();
  if(k==='x'){S.xray=!S.xray;renderTwinUI();}
  else if(k==='e'){S.sep=!S.sep;renderTwinUI();}
  else if(k==='l'){$('#bLayers').click();}
  else if(k==='0'){Twin.stop('kitchen');}
});

/* ---------- ambient life ---------- */
const AMBIENT=[
 ['pantry','get_activities',{en:'Freshness check: bananas ripen tomorrow',ar:'فحص الصلاحية: الموز ينضج غداً'}],
 ['basket','search_groceries_items',{en:'Price watch: local spinach 250 g still Dh 4.50',ar:'مراقبة السعر: السبانخ المحلية 250 غ ما زالت بـ4.50 درهم'}],
 ['portion','food_personalized_search',{en:'Checked your usual restaurants in case you order in tonight',ar:'فحص مطاعمك المعتادة في حال الطلب الليلة'}],
 ['leftover','get_activities',{en:'Leftover rice: 1 day left, planned for lunch',ar:'الأرز المتبقي: يوم واحد، مخطط للغداء'}],
 ['pantry','reverse_geocode',{en:'Confirmed delivery zone: Al Barsha 1',ar:'تأكيد منطقة التوصيل: البرشاء 1'}]
];
let ai=0;
function seed(){
  const base=[['07:00','pantry','get_activities',{en:'Read 30 days of orders to rebuild kitchen memory',ar:'قراءة طلبات 30 يوماً لإعادة بناء ذاكرة المطبخ'}],['07:01','pantry','user_info',{en:'Household of 7, home address Al Barsha',ar:'أسرة من 7 أفراد، العنوان: البرشاء'}],['07:03','leftover','get_activities',{en:'Found 2 leftovers from Sunday dinner',ar:'العثور على بقايا من عشاء الأحد'}],['07:05','basket','search_groceries_items',{en:'Drafted the usual Monday basket from past orders',ar:'إعداد سلة الاثنين المعتادة من الطلبات السابقة'}],['07:06','portion','food_get_restaurant_menu',{en:'Checked menu sizes at your 3 usual restaurants',ar:'فحص أحجام الوجبات في مطاعمك الثلاثة المعتادة'}]];
  base.forEach(([tm,ag,tool,why])=>{S.audit.unshift({time:tm,agent:ag,tool,mut:false,why,status:'read'});S.events.unshift({time:tm,agent:ag,msg:why});});
}
setInterval(()=>{if(document.hidden) return;const [ag,tool,why]=AMBIENT[ai++%AMBIENT.length];call(ag,tool,false,why);},11000);
setInterval(()=>{if(Math.random()<.5) hearts.forEach(h=>h.beat(.35));},2400);
let acc=0,lt=performance.now();
(function hl(ts){acc+=ts-lt;lt=ts;if(acc>1000) acc=0;while(acc>28){hearts.forEach(h=>h.step());acc-=28;}hearts.forEach(h=>h.draw());requestAnimationFrame(hl);})(performance.now());
const mq=matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener) mq.addEventListener('change',()=>{accentCol=cssv('--accent');});

/* ---------- start ---------- */
seed();i18nStatic();renderTrace();
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(VIEWS.includes(h)&&h!==S.view) go(h);});
const start=(location.hash||'').slice(1);
go(VIEWS.includes(start)?start:'twin');
})();
</script>
